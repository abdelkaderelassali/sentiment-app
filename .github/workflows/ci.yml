name: CI
on: [push, pull_request]
jobs:
  tp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # tout l'historique : git shortlog compte les deux auteurs
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Environnement virtuel et dépendances
        run: python -m venv .venv && . .venv/bin/activate && pip install pandas "scikit-learn==1.5.*" pytest "fastapi==0.115.*" "httpx==0.27.*" "uvicorn==0.30.*" "streamlit==1.39.*" "python-dotenv==1.0.*"
      - name: Diagnostic
        run: . .venv/bin/activate && python scripts/check_setup.py
      - name: Modèle de démonstration, pour les tests de l'API (TP3)
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - name: Outils de qualité (TP4)
        run: . .venv/bin/activate && pip install -r requirements-dev.txt
      - name: ruff
        run: . .venv/bin/activate && ruff check .
      - name: mypy
        run: . .venv/bin/activate && mypy api
      - name: Tests et couverture
        run: . .venv/bin/activate && pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95
  client-web:                         # TP 2 : la logique du client web, testée sans navigateur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Tests du client web
        run: node --test web/client.test.mjs

  service-java:                       # section 2.7 : le client Spring Boot de l'API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Compilation et tests
        run: mvn -B -f java/avis-service/pom.xml package
