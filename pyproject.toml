[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
version = "0.6.0"
description = "Application de classification de sentiment en français"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<1.5",
  "scikit-learn>=1.5,<1.6",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<0.31",
  "pandas>=2.2,<2.3",
  "httpx>=0.27,<0.28",
  "streamlit>=1.39,<1.40",
]

[project.scripts]
sentiment = "sentiment_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "sentiment_app*", "ui*"]
exclude = ["tests*", "data*", "models*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.coverage.report]
show_missing = true
skip_empty = true

